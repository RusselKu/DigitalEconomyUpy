name: Data Pipeline & GitHub Pages Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate_and_test:
    name: Validate Data Pipeline & Notebook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Fetch Raw Official Data
        run: |
          python scripts/01_fetch_data.py

      - name: Step 2 - Process & Calculate DRS
        run: |
          python scripts/02_process_data.py

      - name: Step 3 - Regenerate & Execute Jupyter Notebook
        run: |
          python scripts/04_generate_notebook.py
          python -m jupyter nbconvert --to notebook --execute --inplace notebooks/Digital_Economy_Analysis.ipynb

      - name: Step 4 - Verify Processed Dataset Exists
        run: |
          test -f data/processed/digital_economy_clean.csv
          test -f source_log.csv
          test -f data_dictionary.csv

  deploy_pages:
    name: Deploy Interactive Dashboard to GitHub Pages
    needs: validate_and_test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact (Dashboard)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
